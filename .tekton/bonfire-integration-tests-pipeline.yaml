---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: bonfire-integration-tests-pipeline
  labels:
    build.appstudio.redhat.com/pipeline: "bonfire-integration-tests"
spec:
  params:
    # Bonfire repository configuration
    - name: BONFIRE_REPO
      type: string
      description: URL of the Git repository to use for fetching the bonfire tasks
      default: 'https://github.com/RedHatInsights/bonfire-tekton'
    - name: BONFIRE_REVISION
      type: string
      description: Git commit revision to use for fetching the bonfire tasks
      default: main
    - name: BONFIRE_IMAGE
      type: string
      description: The container Bonfire image to use for the tekton tasks

    # Snapshot and pipeline metadata
    - name: SNAPSHOT
      description: The Snapshot JSON containing all component images
      type: string
    - name: PIPELINERUN_NAME
      description: Name of this PipelineRun
      type: string
      default: ""
    - name: PIPELINERUN_UID
      description: UID of this PipelineRun
      type: string
      default: ""

    # Ephemeral environment configuration
    - name: EPHEMERAL_ENV_PROVIDER_SECRET
      type: string
      default: ephemeral-env-provider
      description: Secret for connecting to ephemeral env provider cluster
    - name: APP_INTERFACE_SECRET
      type: string
      default: app-interface
      description: Secret for connecting to app-interface
    - name: AWS_SECRET
      type: string
      default: rh-artifacts-bucket
      description: Secret with connection details to S3
    - name: NAMESPACE_RESERVE_DURATION
      type: string
      description: Duration to reserve the namespace for
      default: "120m"

    # Application configuration
    - name: APP_NAME
      type: string
      description: Name of app-sre application folder this component lives in
      default: "rhsm"
    - name: COMPONENT_NAME
      type: string
      description: Name of Konflux component and app-sre resourceTemplate in deploy.yaml
      default: "curiosity-frontend"
    - name: BONFIRE_COMPONENT_NAME
      type: string
      description: Bonfire component name when it differs from Konflux component name
      default: "curiosity-frontend"
    - name: COMPONENTS
      type: string
      description: Space-separated list of components to load (optional, deploys all if empty)
      default: ""
    - name: COMPONENTS_W_RESOURCES
      type: string
      description: Components to keep resources for (passed to --no-remove-resources)
      default: "app:rhsm"

    # Deployment configuration
    - name: REF_ENV
      type: string
      description: Reference environment for app-interface templates
      default: "insights-production"
    - name: EXTRA_DEPLOY_ARGS
      type: string
      description: Extra arguments for the deployment
      default: >-
        --no-remove-resources app:rhsm
        --exclude-components unleash-proxy
    - name: DEPLOY_FRONTENDS
      type: string
      description: Deploy frontend in the env or not
      default: "true"
    - name: DEPLOY_TIMEOUT
      type: string
      description: Deploy timeout
      default: "1800"

    # IQE test configuration
    - name: IQE_PLUGINS
      type: string
      description: Name of the IQE plugin for this app
      default: "curiosity"
    - name: IQE_CJI_CLOWDAPP_NAME
      type: string
      description: Name of the ClowdApp that invokes the IQE test CJI
      default: "rhsm"
    - name: IQE_MARKER_EXPRESSION
      type: string
      description: Value passed to pytest -m
      default: "ephemeral"
    - name: IQE_FILTER_EXPRESSION
      type: string
      description: Value passed to pytest -k
      default: ""
    - name: IQE_CJI_TIMEOUT
      type: string
      description: Max wait for IQE (deploy-iqe-cji.sh)
      default: "20m"
    - name: IQE_ENV
      type: string
      description: Value to set for ENV_FOR_DYNACONF
      default: "ephemeral"
    - name: IQE_IMAGE_REPOSITORY
      type: string
      description: IQE image repository without tag (must match Bonfire deploy); shown with tag in PR test comments
      default: "quay.io/cloudservices/iqe-tests"
    - name: IQE_IMAGE_TAG
      type: string
      description: Default tag of the IQE image; overridden for PRs that include /use-iqe-image-tag=VALUE in the PR description
      default: "curiosity"
    - name: IQE_PLAYWRIGHT
      type: string
      description: Whether to run IQE pod with a Playwright container
      default: "true"
    - name: IQE_PARALLEL_ENABLED
      type: string
      description: Whether to run IQE with --parallel-enabled
      default: "false"
    - name: IQE_LOG_LEVEL
      type: string
      description: IQE log level
      default: "debug"
    - name: IQE_ENV_VARS
      type: string
      description: Optional extra IQE env vars prepended for deploy-iqe-cji (comma-separated)
      default: ""
    - name: IQE_TEST_RESULTS_AWS_S3_SECRET
      type: string
      description: Secret name in the ephemeral namespace with S3 credentials for test-results upload
      default: ibutsu-aws-credentials

    # Project configuration
    - name: GITHUB_TOKEN_SECRET
      type: string
      description: Secret name containing the GitHub API token (bonfire deploy template fetch and PR comments)
      default: "swatch-ci-github-token"
    - name: PROJECT_REPO
      type: string
      description: GitHub repository in owner/repo format
      default: "RedHatInsights/curiosity-frontend"
    - name: PROJECT_TASKS_REVISION
      type: string
      description: Git revision used to resolve curiosity-frontend task definitions
      default: "main"

  workspaces:
    - name: artifacts

  results:
    - name: ARTIFACTS_URL
      description: URL for the test artifacts
      value: $(tasks.upload-logs-to-s3.results.ARTIFACTS_URL)

  tasks:
    - name: extract-metadata
      params:
        - name: SNAPSHOT
          value: "$(params.SNAPSHOT)"
        - name: COMPONENT_NAME
          value: "$(params.COMPONENT_NAME)"
        - name: PROJECT_REPO
          value: "$(params.PROJECT_REPO)"
        - name: GITHUB_TOKEN_SECRET
          value: "$(params.GITHUB_TOKEN_SECRET)"
        - name: IQE_IMAGE_TAG_DEFAULT
          value: "$(params.IQE_IMAGE_TAG)"
        - name: PIPELINE_RUN_NAME
          value: "$(context.pipelineRun.name)"
      taskRef:
        resolver: git
        params:
          - name: url
            value: "https://github.com/$(params.PROJECT_REPO).git"
          - name: revision
            value: "$(params.PROJECT_TASKS_REVISION)"
          - name: pathInRepo
            value: .tekton/tasks/extract-metadata.yaml

    - name: verify-snapshot-completeness
      runAfter:
        - extract-metadata
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        - name: LABELS
          value: "$(tasks.extract-metadata.results.LABELS)"
        - name: COMPONENT_NAME
          value: "$(params.COMPONENT_NAME)"
      taskSpec:
        params:
          - name: SNAPSHOT
          - name: LABELS
          - name: COMPONENT_NAME
        results:
          - name: SKIP_TESTS
        steps:
          - name: check-snapshot
            image: quay.io/konflux-ci/konflux-test:stable
            script: |
              #!/bin/bash
              set -euo pipefail

              LABELS=",$(params.LABELS),"
              if echo "$LABELS" | grep -qi ",skip-integration-tests,"; then
                echo "skip-integration-tests label found - skipping tests"
                printf "true" > $(results.SKIP_TESTS.path)
                exit 0
              fi

              COMPONENT="$(params.COMPONENT_NAME)"
              SHA=$(echo '$(params.SNAPSHOT)' | jq -r --arg name "$COMPONENT" \
                '.components[] | select(.name==$name) | .source.git.revision // empty')

              if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
                echo "Component $COMPONENT not found in snapshot - skipping tests"
                printf "true" > $(results.SKIP_TESTS.path)
              else
                echo "Snapshot contains $COMPONENT at $SHA - running tests"
                printf "false" > $(results.SKIP_TESTS.path)
              fi

    - name: build-extra-deploy-args
      runAfter:
        - verify-snapshot-completeness
      when:
        - input: "$(tasks.verify-snapshot-completeness.results.SKIP_TESTS)"
          operator: in
          values: ["false"]
      params:
        - name: EXTRA_DEPLOY_ARGS
          value: "$(params.EXTRA_DEPLOY_ARGS)"
        - name: SNAPSHOT
          value: "$(params.SNAPSHOT)"
        - name: GIT_REVISION
          value: "$(tasks.extract-metadata.results.GIT_REVISION)"
        - name: COMPONENT_NAME
          value: "$(params.COMPONENT_NAME)"
      taskSpec:
        params:
          - name: EXTRA_DEPLOY_ARGS
            type: string
          - name: SNAPSHOT
            type: string
          - name: GIT_REVISION
            type: string
          - name: COMPONENT_NAME
            type: string
        results:
          - name: UPDATED_EXTRA_DEPLOY_ARGS
            description: Updated EXTRA_DEPLOY_ARGS with template ref for the frontend component
        steps:
          - name: build-args
            image: quay.io/konflux-ci/task-runner:v3
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              EXTRA_DEPLOY_ARGS="$(params.EXTRA_DEPLOY_ARGS)"
              GIT_REVISION="$(params.GIT_REVISION)"
              COMPONENT="$(params.COMPONENT_NAME)"

              echo "Building extra deploy args..."
              echo "Git revision: $GIT_REVISION"
              echo "Component: $COMPONENT"

              UPDATED_ARGS="$EXTRA_DEPLOY_ARGS"

              if [ -n "$GIT_REVISION" ] && [ -n "$COMPONENT" ]; then
                UPDATED_ARGS="$UPDATED_ARGS --set-template-ref ${COMPONENT}=${GIT_REVISION}"
                echo "Added: --set-template-ref ${COMPONENT}=${GIT_REVISION}"
              fi

              echo ""
              echo "Final args: $UPDATED_ARGS"
              printf "%s" "$UPDATED_ARGS" > $(results.UPDATED_EXTRA_DEPLOY_ARGS.path)

    - name: build-iqe-params
      runAfter:
        - verify-snapshot-completeness
      when:
        - input: "$(tasks.verify-snapshot-completeness.results.SKIP_TESTS)"
          operator: in
          values: ["false"]
      params:
        - name: IQE_ENV_VARS
          value: "$(params.IQE_ENV_VARS)"
        - name: COMPONENT_NAME
          value: "$(params.COMPONENT_NAME)"
        - name: GIT_REVISION
          value: "$(tasks.extract-metadata.results.GIT_REVISION)"
        - name: PIPELINE_RUN_NAME
          value: "$(tasks.extract-metadata.results.PIPELINE_RUN_NAME)"
        - name: TEST_RUN_SOURCE
          value: "$(tasks.extract-metadata.results.TEST_RUN_SOURCE)"
        - name: EVENT_TYPE
          value: "$(tasks.extract-metadata.results.EVENT_TYPE)"
        - name: INTEGRATION_TEST_NAME
          value: "$(tasks.extract-metadata.results.INTEGRATION_TEST_NAME)"
      taskSpec:
        params:
          - name: IQE_ENV_VARS
            type: string
          - name: COMPONENT_NAME
            type: string
          - name: GIT_REVISION
            type: string
          - name: PIPELINE_RUN_NAME
            type: string
          - name: TEST_RUN_SOURCE
            type: string
          - name: EVENT_TYPE
            type: string
          - name: INTEGRATION_TEST_NAME
            type: string
        results:
          - name: IQE_ENV_VARS
            description: Comma-separated env vars for deploy-iqe-cji
        steps:
          - name: build
            image: quay.io/konflux-ci/task-runner:v3
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              prefix="$(params.IQE_ENV_VARS)"
              component="$(params.COMPONENT_NAME)"
              git_revision="$(params.GIT_REVISION)"
              pipeline_name="$(params.PIPELINE_RUN_NAME)"
              source="$(params.TEST_RUN_SOURCE)"
              event_type="$(params.EVENT_TYPE)"
              integration_test_name="$(params.INTEGRATION_TEST_NAME)"
              ibutsu_data="component=${component} git_revision=${git_revision} pipeline_name=${pipeline_name} event_type=${event_type} integration_test_name=${integration_test_name} env=ephemeral tool=konflux source=${source}"

              metadata_vars=(
                "IBUTSU_MODE=archive"
                "IBUTSU_DATA=${ibutsu_data}"
                "IBUTSU_SOURCE=${source}"
              )
              metadata="$(IFS=,; echo "${metadata_vars[*]}")"

              if [[ -n "$prefix" ]]; then
                if [[ "$prefix" == *, ]]; then
                  combined="${prefix}${metadata}"
                else
                  combined="${prefix},${metadata}"
                fi
              else
                combined="${metadata}"
              fi

              echo "build-iqe-params: IQE_ENV_VARS length=${#combined}"
              printf '%s' "$combined" > "$(results.IQE_ENV_VARS.path)"


    - name: github-delete-old-comments
      runAfter:
        - verify-snapshot-completeness
      when:
        - input: "$(tasks.verify-snapshot-completeness.results.SKIP_TESTS)"
          operator: in
          values: ["false"]
        - input: "$(tasks.extract-metadata.results.IS_PULL_REQUEST)"
          operator: in
          values: ["true"]
      params:
        - name: PROJECT_REPO
          value: "$(params.PROJECT_REPO)"
        - name: PR_NUMBER
          value: "$(tasks.extract-metadata.results.PR_NUMBER)"
        - name: GITHUB_TOKEN_SECRET
          value: "$(params.GITHUB_TOKEN_SECRET)"
      taskRef:
        resolver: git
        params:
          - name: url
            value: "https://github.com/$(params.PROJECT_REPO).git"
          - name: revision
            value: "$(params.PROJECT_TASKS_REVISION)"
          - name: pathInRepo
            value: .tekton/tasks/github-delete-comment.yaml

    - name: reserve-namespace
      runAfter:
        - verify-snapshot-completeness
      when:
        - input: "$(tasks.verify-snapshot-completeness.results.SKIP_TESTS)"
          operator: in
          values: ["false"]
      params:
        - name: NS_REQUESTER
          value: "$(context.pipelineRun.name)"
        - name: EPHEMERAL_ENV_PROVIDER_SECRET
          value: "$(params.EPHEMERAL_ENV_PROVIDER_SECRET)"
        - name: BONFIRE_IMAGE
          value: "$(params.BONFIRE_IMAGE)"
        - name: RESERVE_DURATION
          value: "$(params.NAMESPACE_RESERVE_DURATION)"
      taskRef:
        resolver: git
        params:
          - name: url
            value: "$(params.BONFIRE_REPO)"
          - name: revision
            value: "$(params.BONFIRE_REVISION)"
          - name: pathInRepo
            value: tasks/reserve-namespace.yaml

    - name: deploy-application
      onError: continue
      runAfter:
        - reserve-namespace
        - build-extra-deploy-args
      when:
        - input: "$(tasks.verify-snapshot-completeness.results.SKIP_TESTS)"
          operator: in
          values: ["false"]
      workspaces:
        - name: artifacts
          workspace: artifacts
      params:
        - name: BONFIRE_IMAGE
          value: "$(params.BONFIRE_IMAGE)"
        - name: SNAPSHOT
          value: "$(params.SNAPSHOT)"
        - name: NS
          value: "$(tasks.reserve-namespace.results.NS)"
        - name: NS_REQUESTER
          value: "$(context.pipelineRun.name)"
        - name: APP_INTERFACE_SECRET
          value: "$(params.APP_INTERFACE_SECRET)"
        - name: APP_NAME
          value: "$(params.APP_NAME)"
        - name: COMPONENTS
          value: "$(params.COMPONENTS)"
        - name: COMPONENTS_W_RESOURCES
          value: "$(params.COMPONENTS_W_RESOURCES)"
        - name: EXTRA_DEPLOY_ARGS
          value: "$(tasks.build-extra-deploy-args.results.UPDATED_EXTRA_DEPLOY_ARGS)"
        - name: DEPLOY_FRONTENDS
          value: "$(params.DEPLOY_FRONTENDS)"
        - name: DEPLOY_TIMEOUT
          value: "$(params.DEPLOY_TIMEOUT)"
        - name: REF_ENV
          value: "$(params.REF_ENV)"
        - name: EPHEMERAL_ENV_PROVIDER_SECRET
          value: "$(params.EPHEMERAL_ENV_PROVIDER_SECRET)"
        - name: GITHUB_TOKEN_SECRET
          value: "$(params.GITHUB_TOKEN_SECRET)"
      taskSpec:
        params:
          - name: BONFIRE_IMAGE
            type: string
          - name: SNAPSHOT
            type: string
          - name: NS
            type: string
          - name: NS_REQUESTER
            type: string
          - name: APP_INTERFACE_SECRET
            type: string
          - name: APP_NAME
            type: string
          - name: COMPONENTS
            type: string
          - name: COMPONENTS_W_RESOURCES
            type: string
          - name: EXTRA_DEPLOY_ARGS
            type: string
          - name: DEPLOY_FRONTENDS
            type: string
          - name: DEPLOY_TIMEOUT
            type: string
          - name: REF_ENV
            type: string
          - name: EPHEMERAL_ENV_PROVIDER_SECRET
            type: string
          - name: GITHUB_TOKEN_SECRET
            type: string
        workspaces:
          - name: artifacts
        results:
          - name: DEPLOY_SUCCEEDED
            description: Whether the deploy succeeded ("true" or "false")
        steps:
          - name: deploy
            image: "$(params.BONFIRE_IMAGE)"
            env:
              - name: APP_INTERFACE_USERNAME
                valueFrom:
                  secretKeyRef:
                    name: $(params.APP_INTERFACE_SECRET)
                    key: username
              - name: APP_INTERFACE_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: $(params.APP_INTERFACE_SECRET)
                    key: password
              - name: APP_INTERFACE_BASE_URL
                valueFrom:
                  secretKeyRef:
                    name: $(params.APP_INTERFACE_SECRET)
                    key: baseurl
              - name: OC_LOGIN_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: $(params.EPHEMERAL_ENV_PROVIDER_SECRET)
                    key: token
              - name: OC_LOGIN_SERVER
                valueFrom:
                  secretKeyRef:
                    name: $(params.EPHEMERAL_ENV_PROVIDER_SECRET)
                    key: url
              - name: GITHUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: $(params.GITHUB_TOKEN_SECRET)
                    key: github_token
              - name: APP_NAME
                value: $(params.APP_NAME)
              - name: COMPONENTS
                value: $(params.COMPONENTS)
              - name: COMPONENTS_W_RESOURCES
                value: $(params.COMPONENTS_W_RESOURCES)
              - name: SNAPSHOT
                value: $(params.SNAPSHOT)
              - name: BONFIRE_BOT
                value: "true"
              - name: EXTRA_DEPLOY_ARGS
                value: "$(params.EXTRA_DEPLOY_ARGS)"
              - name: DEPLOY_FRONTENDS
                value: "$(params.DEPLOY_FRONTENDS)"
              - name: DEPLOY_TIMEOUT
                value: "$(params.DEPLOY_TIMEOUT)"
              - name: REF_ENV
                value: "$(params.REF_ENV)"
            script: |
              #!/bin/bash
              set +e

              if [ -n "${GITHUB_TOKEN:-}" ]; then
                export GITHUB_TOKEN="$(echo -n "$GITHUB_TOKEN" | tr -d '[:space:]')"
              fi

              DEPLOY_LOG="$(workspaces.artifacts.path)/deploy.log"
              EXIT_CODE_FILE="$(workspaces.artifacts.path)/deploy-exit-code"

              {
                echo "Connecting to the ephemeral namespace cluster"
                login.sh

                echo "deploying to ephemeral"
                if [ -z "${EXTRA_DEPLOY_ARGS}" ]; then
                  EXTRA_DEPLOY_ARGS="$(parse-snapshot.py)"
                else
                  EXTRA_DEPLOY_ARGS+=" $(parse-snapshot.py) "
                fi
                export EXTRA_DEPLOY_ARGS
                deploy.sh "$(params.NS)" "$(params.NS_REQUESTER)"
              } 2>&1 | tee "$DEPLOY_LOG"

              EXIT_CODE=${PIPESTATUS[0]}
              echo "$EXIT_CODE" > "$EXIT_CODE_FILE"
              echo "Deploy exit code: $EXIT_CODE"
              if [ "$EXIT_CODE" -eq 0 ]; then
                printf "true" > $(results.DEPLOY_SUCCEEDED.path)
              else
                printf "false" > $(results.DEPLOY_SUCCEEDED.path)
              fi
              exit 0

    - name: post-deploy-failure-comment
      onError: continue
      runAfter:
        - deploy-application
      when:
        - input: "$(tasks.verify-snapshot-completeness.results.SKIP_TESTS)"
          operator: in
          values: [ "false" ]
        - input: "$(tasks.deploy-application.results.DEPLOY_SUCCEEDED)"
          operator: in
          values: ["false"]
        - input: "$(tasks.extract-metadata.results.IS_PULL_REQUEST)"
          operator: in
          values: ["true"]
      workspaces:
        - name: artifacts
          workspace: artifacts
      params:
        - name: PROJECT_REPO
          value: "$(params.PROJECT_REPO)"
        - name: PR_NUMBER
          value: "$(tasks.extract-metadata.results.PR_NUMBER)"
        - name: PIPELINE_NAME
          value: "$(context.pipelineRun.name)"
        - name: COMMENT_TITLE
          value: "Deploy Failed"
        - name: COMMENT_MARKER
          value: "<!-- swatch-iqe-test-results -->"
        - name: GITHUB_TOKEN_SECRET
          value: "$(params.GITHUB_TOKEN_SECRET)"
      taskRef:
        resolver: git
        params:
          - name: url
            value: "https://github.com/$(params.PROJECT_REPO).git"
          - name: revision
            value: "$(params.PROJECT_TASKS_REVISION)"
          - name: pathInRepo
            value: .tekton/tasks/github-post-deploy-failure.yaml

    - name: run-iqe-tests
      onError: continue
      timeout: "20m"
      runAfter:
        - deploy-application
        - build-iqe-params
      when:
        - input: "$(tasks.verify-snapshot-completeness.results.SKIP_TESTS)"
          operator: in
          values: [ "false" ]
        - input: "$(tasks.deploy-application.results.DEPLOY_SUCCEEDED)"
          operator: in
          values: ["true"]
      params:
        - name: BONFIRE_IMAGE
          value: "$(params.BONFIRE_IMAGE)"
        - name: NS
          value: "$(tasks.reserve-namespace.results.NS)"
        - name: NS_REQUESTER
          value: "$(context.pipelineRun.name)"
        - name: EPHEMERAL_ENV_PROVIDER_SECRET
          value: "$(params.EPHEMERAL_ENV_PROVIDER_SECRET)"
        - name: COMPONENT_NAME
          value: "$(params.COMPONENT_NAME)"
        - name: BONFIRE_COMPONENT_NAME
          value: "$(params.BONFIRE_COMPONENT_NAME)"
        - name: IQE_PLUGINS
          value: "$(params.IQE_PLUGINS)"
        - name: IQE_CJI_CLOWDAPP_NAME
          value: "$(params.IQE_CJI_CLOWDAPP_NAME)"
        - name: IQE_MARKER_EXPRESSION
          value: "$(params.IQE_MARKER_EXPRESSION)"
        - name: IQE_FILTER_EXPRESSION
          value: "$(params.IQE_FILTER_EXPRESSION)"
        - name: IQE_CJI_TIMEOUT
          value: "$(params.IQE_CJI_TIMEOUT)"
        - name: IQE_ENV
          value: "$(params.IQE_ENV)"
        - name: IQE_IMAGE_TAG
          value: "$(tasks.extract-metadata.results.IQE_IMAGE_TAG)"
        - name: IQE_PARALLEL_ENABLED
          value: "$(params.IQE_PARALLEL_ENABLED)"
        - name: IQE_PLAYWRIGHT
          value: "$(params.IQE_PLAYWRIGHT)"
        - name: IQE_ENV_VARS
          value: "$(tasks.build-iqe-params.results.IQE_ENV_VARS)"
      taskRef:
        resolver: git
        params:
          - name: url
            value: "$(params.BONFIRE_REPO)"
          - name: revision
            value: "$(params.BONFIRE_REVISION)"
          - name: pathInRepo
            value: tasks/run-iqe-cji.yaml

    - name: collect-iqe-artifacts
      runAfter:
        - run-iqe-tests
      when:
        - input: "$(tasks.verify-snapshot-completeness.results.SKIP_TESTS)"
          operator: in
          values: [ "false" ]
        - input: "$(tasks.deploy-application.results.DEPLOY_SUCCEEDED)"
          operator: in
          values: ["true"]
      workspaces:
        - name: artifacts
          workspace: artifacts
      params:
        - name: NS
          value: "$(tasks.reserve-namespace.results.NS)"
        - name: BONFIRE_IMAGE
          value: "$(params.BONFIRE_IMAGE)"
        - name: EPHEMERAL_ENV_PROVIDER_SECRET
          value: "$(params.EPHEMERAL_ENV_PROVIDER_SECRET)"
      taskSpec:
        params:
          - name: NS
          - name: BONFIRE_IMAGE
          - name: EPHEMERAL_ENV_PROVIDER_SECRET
        workspaces:
          - name: artifacts
        steps:
          - name: collect
            image: "$(params.BONFIRE_IMAGE)"
            env:
              - name: OC_LOGIN_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: $(params.EPHEMERAL_ENV_PROVIDER_SECRET)
                    key: token
              - name: OC_LOGIN_SERVER
                valueFrom:
                  secretKeyRef:
                    name: $(params.EPHEMERAL_ENV_PROVIDER_SECRET)
                    key: url
              - name: BONFIRE_BOT
                value: "true"
            script: |
              #!/bin/bash
              set -euo pipefail

              ns="$(params.NS)"
              artifacts_dir="$(workspaces.artifacts.path)"

              echo "Connecting to the ephemeral namespace cluster"
              login.sh

              get_iqe_pod() {
                local pods
                local ret=0
                pods=($(oc_wrapper get pods -o name -n "$ns" | grep iqe)) || ret="$?"
                if [[ "$ret" -ne 0 ]] || [[ ${#pods[@]} -eq 0 ]]; then
                  echo "Failed to detect IQE pod in $ns" >&2
                  oc_wrapper get pods -n "$ns" >&2 || true
                  return 1
                fi
                if [[ ${#pods[@]} -ne 1 ]]; then
                  echo "Expected exactly one IQE pod, found: ${pods[*]}" >&2
                  return 1
                fi
                echo "${pods[0]#pod/}"
              }

              pod="$(get_iqe_pod)"
              bucket_name="${pod}-artifacts"

              local_svc_port="$(python -c 'import socket; s=socket.socket(); s.bind(("", 0)); print(s.getsockname()[1]); s.close()')"
              oc_wrapper port-forward "svc/env-${ns}-minio" "${local_svc_port}:9000" -n "$ns" &
              port_forward_pid=$!
              sleep 5
              trap 'kill "$port_forward_pid" 2>/dev/null || true' EXIT

              oc_wrapper get secret "env-${ns}-minio" -o json -n "$ns" | jq -r '.data' > minio-creds.json
              minio_access="$(jq -r .accessKey < minio-creds.json | base64 -d)"
              minio_secret="$(jq -r .secretKey < minio-creds.json | base64 -d)"
              if [[ -z "$minio_access" ]] || [[ -z "$minio_secret" ]]; then
                echo "Failed to read MinIO credentials from env-${ns}-minio" >&2
                exit 1
              fi

              endpoint_url="http://localhost:${local_svc_port}"
              export AWS_ACCESS_KEY_ID="$minio_access"
              export AWS_SECRET_ACCESS_KEY="$minio_secret"
              export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"

              echo "Fetching IQE artifacts from minio bucket ${bucket_name} into ${artifacts_dir}"
              minio_success=false
              for attempt in $(seq 1 5); do
                if aws --endpoint-url "$endpoint_url" s3 sync \
                  "s3://${bucket_name}/" "$artifacts_dir" --only-show-errors; then
                  minio_success=true
                  break
                fi
                if [[ "$attempt" -lt 5 ]]; then
                  echo "WARNING: minio artifact copy failed (attempt ${attempt}/5), retrying in 5s..." >&2
                  sleep 5
                fi
              done

              if [[ "$minio_success" != true ]]; then
                echo "ERROR: minio artifact copy failed after 5 attempts" >&2
                exit 1
              fi

              echo "IQE artifacts collected:"
              ls -la "$artifacts_dir"

    - name: collect-logs
      onError: continue
      runAfter:
        - collect-iqe-artifacts
      when:
        - input: "$(tasks.verify-snapshot-completeness.results.SKIP_TESTS)"
          operator: in
          values: [ "false" ]
        - input: "$(tasks.deploy-application.results.DEPLOY_SUCCEEDED)"
          operator: in
          values: ["true"]
      workspaces:
        - name: artifacts
          workspace: artifacts
      params:
        - name: NS
          value: "$(tasks.reserve-namespace.results.NS)"
        - name: BONFIRE_IMAGE
          value: "$(params.BONFIRE_IMAGE)"
        - name: EPHEMERAL_ENV_PROVIDER_SECRET
          value: "$(params.EPHEMERAL_ENV_PROVIDER_SECRET)"
      taskSpec:
        params:
          - name: NS
          - name: BONFIRE_IMAGE
          - name: EPHEMERAL_ENV_PROVIDER_SECRET
        workspaces:
          - name: artifacts
        steps:
          - name: collect
            image: "$(params.BONFIRE_IMAGE)"
            env:
              - name: OC_LOGIN_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: $(params.EPHEMERAL_ENV_PROVIDER_SECRET)
                    key: token
              - name: OC_LOGIN_SERVER
                valueFrom:
                  secretKeyRef:
                    name: $(params.EPHEMERAL_ENV_PROVIDER_SECRET)
                    key: url
              - name: BONFIRE_BOT
                value: "true"
            script: |
              #!/bin/bash
              set -ex

              echo "Connecting to the ephemeral namespace cluster"
              login.sh

              ARTIFACTS_DIR="$(workspaces.artifacts.path)"
              echo "Collecting namespace logs into ${ARTIFACTS_DIR}"
              collect-logs.sh "$(params.NS)" "$ARTIFACTS_DIR" || :

              echo "Artifacts collected:"
              ls -la "$ARTIFACTS_DIR"

    - name: post-pr-comment
      onError: continue
      runAfter:
        - collect-iqe-artifacts
      when:
        - input: "$(tasks.verify-snapshot-completeness.results.SKIP_TESTS)"
          operator: in
          values: [ "false" ]
        - input: "$(tasks.deploy-application.results.DEPLOY_SUCCEEDED)"
          operator: in
          values: ["true"]
        - input: "$(tasks.extract-metadata.results.IS_PULL_REQUEST)"
          operator: in
          values: ["true"]
      workspaces:
        - name: artifacts
          workspace: artifacts
      params:
        - name: PROJECT_REPO
          value: "$(params.PROJECT_REPO)"
        - name: PR_NUMBER
          value: "$(tasks.extract-metadata.results.PR_NUMBER)"
        - name: PIPELINE_NAME
          value: "$(context.pipelineRun.name)"
        - name: JUNIT_FILE
          value: "junit-curiosity-sequential.xml"
        - name: COMMENT_TITLE
          value: "IQE Tests"
        - name: GITHUB_TOKEN_SECRET
          value: "$(params.GITHUB_TOKEN_SECRET)"
        - name: IQE_IMAGE
          value: "$(params.IQE_IMAGE_REPOSITORY):$(tasks.extract-metadata.results.IQE_IMAGE_TAG)"
      taskRef:
        resolver: git
        params:
          - name: url
            value: "https://github.com/$(params.PROJECT_REPO).git"
          - name: revision
            value: "$(params.PROJECT_TASKS_REVISION)"
          - name: pathInRepo
            value: .tekton/tasks/github-post-test-results.yaml

    - name: upload-logs-to-s3
      onError: continue
      runAfter:
        - collect-logs
      when:
        - input: "$(tasks.verify-snapshot-completeness.results.SKIP_TESTS)"
          operator: in
          values: [ "false" ]
        - input: "$(tasks.deploy-application.results.DEPLOY_SUCCEEDED)"
          operator: in
          values: ["true"]
      workspaces:
        - name: artifacts
          workspace: artifacts
      params:
        - name: BONFIRE_IMAGE
          value: "$(params.BONFIRE_IMAGE)"
        - name: AWS_SECRET
          value: "$(params.AWS_SECRET)"
        - name: ARTIFACTS_KEY
          value: "$(context.pipelineRun.namespace)/$(context.pipelineRun.name)"
      taskSpec:
        params:
          - name: BONFIRE_IMAGE
          - name: AWS_SECRET
          - name: ARTIFACTS_KEY
        workspaces:
          - name: artifacts
        results:
          - name: ARTIFACTS_URL
        steps:
          - name: upload
            image: "$(params.BONFIRE_IMAGE)"
            env:
              - name: AWS_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef:
                    name: $(params.AWS_SECRET)
                    key: aws_access_key_id
              - name: AWS_SECRET_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: $(params.AWS_SECRET)
                    key: aws_secret_access_key
              - name: AWS_DEFAULT_REGION
                value: us-east-1
              - name: BUCKET
                value: rh-artifacts-bucket
              - name: ARTIFACTS_KEY
                value: "$(params.ARTIFACTS_KEY)"
            script: |
              #!/bin/bash
              set -ex

              ARTIFACTS_DIR="$(workspaces.artifacts.path)"
              mkdir -p "$ARTIFACTS_DIR"
              bucket="${BUCKET:-rh-artifacts-bucket}"
              artifacts_key="${ARTIFACTS_KEY:?ARTIFACTS_KEY required}"
              region="${AWS_DEFAULT_REGION:-us-east-1}"
              echo "Copying namespace and IQE logs to S3 from $ARTIFACTS_DIR"
              aws s3 cp --recursive "$ARTIFACTS_DIR" "s3://${bucket}/${artifacts_key}" --quiet
              url="https://s3.console.aws.amazon.com/s3/buckets/${bucket}?region=${region}&prefix=${artifacts_key}/&showversions=false"
              echo -n "$url" | tee "$(results.ARTIFACTS_URL.path)"

    - name: upload-test-results-to-s3
      onError: continue
      runAfter:
        - collect-iqe-artifacts
      when:
        - input: "$(tasks.verify-snapshot-completeness.results.SKIP_TESTS)"
          operator: in
          values: [ "false" ]
        - input: "$(tasks.deploy-application.results.DEPLOY_SUCCEEDED)"
          operator: in
          values: ["true"]
      workspaces:
        - name: artifacts
          workspace: artifacts
      params:
        - name: NS
          value: "$(tasks.reserve-namespace.results.NS)"
        - name: BONFIRE_IMAGE
          value: "$(params.BONFIRE_IMAGE)"
        - name: EPHEMERAL_ENV_PROVIDER_SECRET
          value: "$(params.EPHEMERAL_ENV_PROVIDER_SECRET)"
        - name: TEST_RESULTS_AWS_S3_SECRET
          value: "$(params.IQE_TEST_RESULTS_AWS_S3_SECRET)"
      taskRef:
        resolver: git
        params:
          - name: url
            value: "https://github.com/$(params.PROJECT_REPO).git"
          - name: revision
            value: "$(params.PROJECT_TASKS_REVISION)"
          - name: pathInRepo
            value: .tekton/tasks/upload-test-results-to-s3.yaml

  finally:
    - name: check-test-results
      when:
        - input: "$(tasks.verify-snapshot-completeness.results.SKIP_TESTS)"
          operator: in
          values: ["false"]
      params:
        - name: DEPLOY_SUCCEEDED
          value: "$(tasks.deploy-application.results.DEPLOY_SUCCEEDED)"
        - name: IQE_STATUS
          value: "$(tasks.run-iqe-tests.status)"
      taskSpec:
        params:
          - name: DEPLOY_SUCCEEDED
            type: string
          - name: IQE_STATUS
            type: string
        steps:
          - name: check
            image: quay.io/konflux-ci/task-runner:v3
            script: |
              #!/bin/bash
              FAILED=false
              echo "Deploy succeeded: $(params.DEPLOY_SUCCEEDED)"
              if [ "$(params.DEPLOY_SUCCEEDED)" != "true" ]; then
                echo "Deploy did not succeed."
                FAILED=true
              fi
              echo "IQE tests status: $(params.IQE_STATUS)"
              if [ "$(params.IQE_STATUS)" != "Succeeded" ]; then
                echo "IQE tests did not succeed."
                FAILED=true
              fi
              if [ "$FAILED" = "true" ]; then
                echo "Pipeline failed."
                exit 1
              fi
              echo "All steps passed."

    - name: release-namespace
      when:
        - input: "$(tasks.verify-snapshot-completeness.results.SKIP_TESTS)"
          operator: in
          values: ["false"]
      params:
        - name: NS
          value: "$(tasks.reserve-namespace.results.NS)"
        - name: NS_REQUESTER
          value: "$(context.pipelineRun.name)"
        - name: BONFIRE_IMAGE
          value: "$(params.BONFIRE_IMAGE)"
        - name: EPHEMERAL_ENV_PROVIDER_SECRET
          value: "$(params.EPHEMERAL_ENV_PROVIDER_SECRET)"
      taskSpec:
        params:
          - name: NS
          - name: NS_REQUESTER
          - name: BONFIRE_IMAGE
          - name: EPHEMERAL_ENV_PROVIDER_SECRET
        steps:
          - name: release
            image: "$(params.BONFIRE_IMAGE)"
            env:
              - name: OC_LOGIN_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: $(params.EPHEMERAL_ENV_PROVIDER_SECRET)
                    key: token
              - name: OC_LOGIN_SERVER
                valueFrom:
                  secretKeyRef:
                    name: $(params.EPHEMERAL_ENV_PROVIDER_SECRET)
                    key: url
              - name: BONFIRE_BOT
                value: "true"
            script: |
              #!/bin/bash
              set -ex

              echo "Connecting to the ephemeral namespace cluster"
              login.sh

              echo "Releasing ephemeral namespace: $(params.NS)"
              release-ns.sh "$(params.NS)" "$(params.NS_REQUESTER)"
